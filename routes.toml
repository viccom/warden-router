# --- VNT 组网服务端（vnts2 v2.0.7，wss 数据面，见 services.toml 注释）---
[[route]]
prefix = "/vnts/"
host = "127.0.0.1"
port = 39999
mode = "keep"
display = "VNT 组网(wss)"
desc = "vnts2 虚拟组网：经 socat TLS 桥到 :39872（数据面全 TLS，握手不校验路径/Host）"
icon = "🌐"
hidden = true

# --- vnts2 Web 管理（:39871 HTTP 明文，前端为绝对路径资源，不支持子路径）---
# /vnts-admin/ 剥前缀取回首页；资源与 API 由 /assets/、/api/ 两条 keep 路由
# 承载（前端 JS 用绝对路径 /assets/... /api/...，反代无法重写）。
# /api/ 与代码默认的 /api/v1/ 同属静态层，最长前缀匹配互不影响。
# 注意：/api/ 会吃掉所有未声明的 /api/* 前缀，未来新增服务 API 需更具体前缀。
[[route]]
prefix = "/vnts-admin/"
host = "127.0.0.1"
port = 39871
mode = "strip"
display = "VNT 管理台"
desc = "vnts2 Web 管理：网络/设备/订阅管理（user / 见 vnts 配置文件）"
icon = "🧩"

[[route]]
prefix = "/assets/"
host = "127.0.0.1"
port = 39871
mode = "keep"
display = ""
desc = "vnts2 前端静态资源（绝对路径承载，不进导航）"
icon = ""
hidden = true
[[route]]
prefix = "/api/"
host = "127.0.0.1"
port = 39871
mode = "keep"
display = ""
desc = "vnts2 Web API（/api/v1/ 更长前缀优先，不受影响；不进导航）"
icon = ""
hidden = true

# --- 网络测速（librespeed :8800，原 warden ui_url discovered 卡片）---
# 静态层同参声明压过 discovered（Lookup 优先级 static > discovered），
# 配合 hidden 使卡片下架而代理保留
[[route]]
prefix = "/speed/"
host = "127.0.0.1"
port = 8800
mode = "strip"
display = "网络测速"
desc = "librespeed-rust"
icon = "📶"
