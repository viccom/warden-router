# warden-route 声明式路由文件（routes.toml）
#
# 与 config.go 的 staticRoutes() 合并：同前缀本文件优先
# （显式声明压过代码默认）。未提及的前缀（/api/v1/、/backend/ 等
# 裸 API 透传）继续由代码提供，不进导航宫格。
#
# 保存后 5s 内热加载生效；kill -HUP <pid> 立即重载；
# 语法错误整版拒绝并保留上一版（不会把路由表改坏）。
#
# 字段说明：
#   prefix / host / port   必填。prefix 须以 / 开头和结尾（如 "/wiki/"）
#   mode                   "strip"（前缀剥离，上游看到子路径）|
#                          "keep"（前缀保留，上游自行解析，如 ttyd -b）
#   display / desc / icon  导航卡片展示（icon 支持 emoji）
#   hidden                 true 时路由代理照常工作但不进导航宫格
#                          （2026-10-14 新增：宫格精简为仅 VNT 管理台，
#                          其余服务路径保留直连）
#   response_header_timeout 可选，如 "10s"；0=不设（默认）。
#                          只约束等响应头的时间，不会掐断 WS/流式。
#
# 当前条目与 config.go 的静态路由等价——保留在此作为活文档：
# 调整挂载（端口、模式、展示）改这里即可，无需重新编译。

[[route]]
prefix = "/warden/"
host = "127.0.0.1"
port = 8789
mode = "strip"
display = "Warden 管理台"
desc = "进程监护控制台：服务启停、日志、指标"
icon = "🛠️"
[[route]]
prefix = "/monitor/"
host = "127.0.0.1"
port = 27960
mode = "keep"
display = "Kula 主机监控"
desc = "单二进制 Linux 监控：1s 采集 / 环形缓冲 / 磁盘用量 + 进程·网络监测"
icon = "📈"
[[route]]
prefix = "/terminal/"
host = "127.0.0.1"
port = 27970
mode = "keep"
display = "网页终端"
desc = "浏览器经 HTTPS 通道直连沙箱 shell（ttyd，需密码）"
icon = "⌨️"

# --- 文件服务（dufs 双实例，2026-10-14 新增）---
# downloads = 只读实例（:5001）：浏览/下载，禁上传禁删除
# uploads   = 可上传实例（:5002）：浏览/上传，禁删除/移动/重命名
# 两者均以 --path-prefix 认领子路径，故 router 走 keep 模式原样转发。
[[route]]
prefix = "/files/downloads/"
host = "127.0.0.1"
port = 5001
mode = "keep"
display = "文件下载"
desc = "dufs 只读：浏览与下载 /workspace/files/downloads（禁上传/删除）"
icon = "📦"
[[route]]
prefix = "/files/uploads/"
host = "127.0.0.1"
port = 5002
mode = "keep"
display = "文件上传"
desc = "dufs 可上传：浏览器直传 /workspace/files/uploads（禁删除/移动，同名可覆盖）"
icon = "📤"

# --- OpenList 文件库（v4.2.6，base_path=/openlist 子路径模式）---
[[route]]
prefix = "/openlist/"
host = "127.0.0.1"
port = 5244
mode = "keep"
display = "OpenList 文件库"
desc = "多存储挂载文件列表：本地/网盘/WebDAV，预览、分享、WebDAV（admin 初始密码见 warden 日志）"
icon = "🗂️"

